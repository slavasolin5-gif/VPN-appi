name: Build Android APK (sing-box VPN)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Download Prebuilt sing-box libbox.aar
        run: |
          mkdir -p android/app/libs
          echo "Fetching latest official libbox.aar release..."
          AAR_URL="https://github.com/SagerNet/sing-box/releases/download/v1.10.7/libbox-1.10.7.aar"
          curl -L -f --retry 3 -o android/app/libs/libbox.aar "$AAR_URL" || {
            echo "Fallback..."
            FALLBACK_URL="https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-1.10.1.aar"
            curl -L -f --retry 3 -o android/app/libs/libbox.aar "$FALLBACK_URL"
          }
          if [ ! -s android/app/libs/libbox.aar ]; then
            echo "❌ ERROR: libbox.aar is empty or missing!"
            exit 1
          fi

      - name: 🧩 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: singbox-vpn-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
